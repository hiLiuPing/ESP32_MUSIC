; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
upload_speed = 230400          ; 降低波特率提升大文件上传稳定性，不要921600
monitor_speed = 115200

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 32MB       ; 对应ArduinoIDE中的【32MB(256Mb)】选项
board_build.arduino.partitions = large_littlefs_32MB.csv
board_build.filesystem = littlefs
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; upload_flags =
;     --no-stub

build_flags = 
	-Iinclude
	-DBSP_LITTLEFS_DEBUG_MODE=0
	-DHOME_DEMO_ENABLE=0        ; 1: Home 27-scene test mode, 0: normal RTC/weather
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	
	-DARDUINO_USB_CDC_ON_BOOT=0
	
	-DARDUINO_USB_DFU_ON_BOOT=0
	
	-DARDUINO_USB_MSC_ON_BOOT=0
   


; 2 MB QSPI PSRAM is enabled explicitly above.

; pio run -t erase
; pio run -t upload
; pio run -t uploadfs
